[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ar"
version = "0.1.0"
description = "PRISM-AR — risk-adaptive AR cue mapping for VRUs, extending SafeDriver-IQ/PRISM Phase 2"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = "test_*.py"
python_functions = "test_*"
